name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.repository.private }} # releases live on the public repo; the private dev repo has no hosted minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tagged commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm test
      - run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" -F notes.md
        env:
          GH_TOKEN: ${{ github.token }}
