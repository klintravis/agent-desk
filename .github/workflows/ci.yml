name: ci
on:
  push:
    branches: ['**'] # agent branches too: `desk wt finish` waits for a run on the pushed head
  pull_request:

jobs:
  test:
    # One run per commit: a pull request from a branch of this repo already ran on its push. Only a fork's PR, which has no push here, runs on pull_request.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # Node 22 on every OS; Node 20 (the minimum in package.json engines) on Linux only: what breaks on one OS is not the Node version.
        node: [22]
        # The private dev repo uses the owner's machine (hosted minutes ran out). A fork's PR can edit this file, so the real barrier is: never register a runner on the public repo.
        os: ${{ github.event.repository.private && fromJSON('[["self-hosted","linux","adesk"]]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
        include:
          - node: 20
            os: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","adesk"]') || 'ubuntu-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }} # the tests leave their temp folders; this machine is not thrown away after a job
      # The plugin's hook tests (hooks/*.test.ts) need the CLI; no API key or secret is used. Pinned to one version and installed under the job's temp folder, so no global npm install is made; npm's cache still lands in the runner's home.
      - name: Install Claude Code CLI
        if: matrix.node == 22
        shell: bash
        run: |
          npm install --prefix "${{ runner.temp }}/claude" @anthropic-ai/claude-code@2.1.317
          echo "${{ runner.temp }}/claude/node_modules/.bin" >> "$GITHUB_PATH"
      - run: claude plugin test
        if: matrix.node == 22
